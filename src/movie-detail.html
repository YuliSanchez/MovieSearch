<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detalle de película</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f8f9fa;
    }

    .movie-card img {
      object-fit: cover;
      height: 250px;
    }
  </style>
</head>

<body>
  <!-- Encabezado -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <span class="me-2">🎬</span>
        Detalle de película
      </a>
    </div>
  </nav>
  <!-- Resultados -->
  <main class="container my-5">
    <div class="debug-info"></div>
    <div id="movie-detail" class="row g-4 movie-id"></div>
    <!-- Tarjeta de película -->
    <div id="render-movie-detail" class="container my-5">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="card shadow-lg border-0 rounded-3">
            <div class="row g-0">
              <!-- Imagen -->
              <!-- Detalles -->
              <div class="col-md-8">
                <div class="card-body">
                  <h3 class="card-title">Título de la Película</h3>
                  <p class="text-muted mb-1">Año: <span id="year">1999</span></p>
                  <p class="text-muted mb-1">Director: <span id="director">Nombre del Director</span></p>
                  <p class="text-muted mb-3">Género: <span id="genre">Acción</span></p>
                  <p class="card-text">
                    Aquí va una breve sinopsis de la película. Puedes escribir un resumen corto
                    para mostrar de qué trata.
                  </p>
                  <a href="#" class="btn btn-primary mt-3">Ver Trailer</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="./js/movie.detail.js"></script>
</body>

</html>
