<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buscador de Películas</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #f8f9fa;
      }

      .movie-card img {
        object-fit: cover;
        height: 250px;
      }
    </style>
  </head>
  <body>
    <!-- Encabezado -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="#">🎬 Buscador de Películas</a>
      </div>
    </nav>

    <!-- Barra de búsqueda -->
    <section class="py-4 bg-light">
      <div class="container">
        <div class="row g-3">
          <div class="col-md-2">
            <input
              id="page-size"
              type="text"
              class="form-control"
              placeholder="tamaño de página"
            />
          </div>
          <div class="col-md-4">
            <input
              id="searchMovieToken"
              type="text"
              class="form-control"
              placeholder="Buscar por título o director..."
            />
          </div>
          <div class="col-md-4">
            <select id="gender-list" class="form-select">
              <option value="">Todas las categorías</option>
            </select>
          </div>
          <div class="col-md-2 d-grid">
            <button id="search-movies-btn" class="btn btn-primary">
              Buscar
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- Resultados -->
     <div class="debug-info"></div>
    <main class="container my-5">
      
      <div id="movies-list" class="row g-4">
        <!-- Tarjeta de película -->
        <div class="col-sm-6 col-md-4 col-lg-3">
          <div class="card movie-card">
            <img
              class="card-img-top"
              alt="Póster película"
            />
            <div class="card-body">
              <h5 class="card-title">Título de la Película</h5>
              <p class="card-text">
                Año: 2024<br />
                Director: Jane Doe
              </p>
              <a href="#" class="btn btn-sm btn-primary">Ver más</a>
            </div>
          </div>
        </div>
        <!-- Duplica las tarjetas para ver más -->
        <div class="col-sm-6 col-md-4 col-lg-3">
          <div class="card movie-card">
            <img
              src="https://via.placeholder.com/300x250?text=Poster"
              class="card-img-top"
              alt="Póster película"
            />
            <div class="card-body">
              <h5 class="card-title">Otra Película</h5>
              <p class="card-text">
                Año: 2023<br />
                Director: John Doe
              </p>
              <a href="#" class="btn btn-sm btn-primary">Ver más</a>
            </div>
          </div>
        </div>
      </div>

      <!-- Paginación -->
      <nav aria-label="Page navigation" class="mt-4">
        <ul id="pagination" class="pagination justify-content-center">
          <li class="page-item disabled">
            <a class="page-link" href="#" tabindex="-1" aria-disabled="true"
              >Anterior</a
            >
          </li>
          <li class="page-item active">
            <a class="page-link" href="#" >1</a>
          </li>
          <li class="page-item">
            <a class="page-link" href="#">2</a>
          </li>
          <li class="page-item">
            <a class="page-link" href="#">3</a>
          </li>
          <li class="page-item">
            <a class="page-link" href="#">Siguiente</a>
          </li>
        </ul>
      </nav>
    </main>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      ></script>
      <script type="module" src="./js/app.js"></script>
  </body>
</html>
